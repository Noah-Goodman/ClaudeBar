name: ClaudeBar
options:
  bundleIdPrefix: com.vinnysaj
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false
targets:
  ClaudeBar:
    type: application
    platform: macOS
    sources:
      - path: ClaudeBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.vinnysaj.claudebar
        PRODUCT_NAME: ClaudeBar
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_GENERATION_MODE: GeneratedFile
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_CFBundleDisplayName: ClaudeBar
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
